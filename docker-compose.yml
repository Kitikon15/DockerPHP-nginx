services:
  db:
    image: mariadb:latest
    container_name: lemp_mariadb03
    volumes:
      - ./mariadb/initdb/:/docker-entrypoint-initdb.d
      - ./mariadb/data/:/var/lib/mysql/
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=sample_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
    restart: always
    # restart: unless-stopped
    networks:
      - web_kitikon
  php:
    depends_on:
      - db
    build: php/
    container_name: lemp_php03
    volumes:
      - ./public_html/:/var/www/html
    expose:
      - "9000"
    restart: always
    networks:
      - web_kitikon
  nginx:
    image: nginx:stable-alpine
    container_name: lemp_nginx03
    volumes:
      - ./public_html/:/var/www/html
      - ./nginx/conf/nginx.conf:/etc/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8803:80"
    restart: always
    networks:
      - web_kitikon
networks:
  web_kitikon:
    name: lemp
    driver: bridge